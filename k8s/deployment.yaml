apiVersion: apps/v1
kind: Deployment
metadata:
  name: treasury-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: treasury-api
  template:
    metadata:
      labels:
        app: treasury-api
    spec:
      containers:
        - name: treasury-api
          image: treasury-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
